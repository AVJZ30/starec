<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opiniones Star Ec ✨</title>
    
    <!-- NUEVO LOGO como favicon -->
    <link rel="icon" type="image/x-icon" href="https://i.pinimg.com/736x/bc/14/5d/bc145d6d04b34c1d6e597726e444dd53.jpg">
    <link rel="apple-touch-icon" href="https://i.pinimg.com/736x/bc/14/5d/bc145d6d04b34c1d6e597726e444dd53.jpg">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Raleway:wght@300;400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --celeste: #A8DFF1;
            --celeste-suave: #d4eef7;
            --celeste-claro: #eaf6fa;
            --marron: #4A2F1D;
            --marron-claro: #6b4a32;
            --marron-oscuro: #2e1c10;
            --marron-suave: #f5ede6;
            --blanco: #FFFFFF;
            --blanco-roto: #FFFDF9;
            --texto-oscuro: #3E2F1C;
            --texto-medio: #6B5D4A;
            --sombra-suave: 0 4px 20px rgba(74, 47, 29, 0.06);
            --sombra-media: 0 12px 35px rgba(74, 47, 29, 0.1);
            --borde-redondo: 22px;
            --transicion: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Raleway', sans-serif;
            background-color: var(--blanco-roto);
            color: var(--texto-oscuro);
            overflow-x: hidden;
            line-height: 1.6;
        }
        
        h1, h2, h3 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--blanco-roto);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--marron-claro);
            border-radius: 10px;
        }
        
        /* HEADER */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 14px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10000;
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 1px 20px rgba(74, 47, 29, 0.05);
            border-bottom: 1px solid var(--celeste);
            transition: var(--transicion);
        }

        header.scrolled {
            padding: 12px 6%;
            box-shadow: 0 4px 25px rgba(74, 47, 29, 0.08);
        }
        
        /* NUEVO LOGO */
        .logo-img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--marron);
            transition: var(--transicion);
            background: white;
            padding: 2px;
        }
        
        .logo-img:hover {
            transform: scale(1.08) rotate(-2deg);
            box-shadow: 0 4px 15px rgba(74, 47, 29, 0.15);
        }
        
        .nav-menu {
            display: flex;
            gap: 32px;
        }
        
        .nav-menu a {
            text-decoration: none;
            color: var(--marron);
            font-weight: 600;
            font-size: 14.5px;
            letter-spacing: 0.5px;
            transition: var(--transicion);
            font-family: 'Quicksand', sans-serif;
            position: relative;
            padding: 4px 0;
        }

        .nav-menu a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 1.5px;
            background: var(--marron);
            transition: width 0.35s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            border-radius: 10px;
        }
        
        .nav-menu a:hover, .nav-menu a.active {
            color: var(--marron-oscuro);
        }

        .nav-menu a:hover::after, .nav-menu a.active::after {
            width: 100%;
        }
        
        /* HERO DE OPINIONES */
        .opiniones-hero {
            margin-top: 80px;
            padding: 65px 10% 50px;
            text-align: center;
            background: linear-gradient(180deg, var(--celeste-claro) 0%, var(--celeste-suave) 100%);
            position: relative;
            overflow: hidden;
        }
        
        .opiniones-hero::before {
            content: '';
            position: absolute;
            top: -80px;
            right: -60px;
            width: 260px;
            height: 260px;
            background: var(--celeste);
            border-radius: 50%;
            opacity: 0.3;
            animation: floatSlow 7s ease-in-out infinite;
        }
        
        .opiniones-hero::after {
            content: '';
            position: absolute;
            bottom: -50px;
            left: -50px;
            width: 200px;
            height: 200px;
            background: var(--celeste);
            border-radius: 50%;
            opacity: 0.25;
            animation: floatSlow 9s ease-in-out infinite reverse;
        }
        
        @keyframes floatSlow {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-20px, -15px) scale(1.06); }
        }
        
        .opiniones-hero h1 {
            font-size: 56px;
            margin-bottom: 16px;
            color: var(--marron);
            position: relative;
            z-index: 2;
            letter-spacing: 1px;
        }
        
        .opiniones-hero p {
            font-size: 18px;
            color: var(--marron-claro);
            font-weight: 600;
            max-width: 500px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.8);
            padding: 12px 30px;
            border-radius: 50px;
            backdrop-filter: blur(8px);
            border: 1px solid var(--celeste);
            display: inline-block;
        }
        
        /* CONTENEDOR PRINCIPAL */
        .opiniones-container {
            padding: 50px 6%;
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }
        
        /* FORMULARIO */
        .formulario-section {
            background: var(--blanco);
            border-radius: var(--borde-redondo);
            padding: 40px 36px;
            box-shadow: var(--sombra-suave);
            position: sticky;
            top: 100px;
            height: fit-content;
            border: 1px solid #e8ddd0;
            transition: var(--transicion);
        }
        
        .formulario-section:hover {
            box-shadow: var(--sombra-media);
            border-color: var(--celeste);
        }
        
        .formulario-section h2 {
            font-size: 34px;
            margin-bottom: 26px;
            color: var(--marron);
            position: relative;
            display: inline-block;
        }
        
        .formulario-section h2::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 45px;
            height: 2.5px;
            background: var(--marron);
            border-radius: 4px;
            transition: width 0.4s ease;
        }

        .formulario-section:hover h2::after {
            width: 70px;
        }
        
        .form-group {
            margin-bottom: 22px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--marron);
            font-size: 14.5px;
            font-family: 'Quicksand', sans-serif;
            letter-spacing: 0.3px;
        }
        
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 14px 18px;
            border: 1.5px solid #e0d6cc;
            border-radius: 18px;
            font-family: 'Raleway', sans-serif;
            font-size: 14.5px;
            transition: var(--transicion);
            background: var(--blanco-roto);
            color: var(--texto-oscuro);
        }
        
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--marron);
            box-shadow: 0 0 0 4px rgba(74, 47, 29, 0.06);
            background: white;
        }
        
        /* SISTEMA DE ESTRELLAS */
        .rating-stars {
            display: flex;
            gap: 6px;
            font-size: 30px;
            cursor: pointer;
        }
        
        .rating-stars i {
            color: #ddd6cc;
            transition: var(--transicion);
        }
        
        .rating-stars i.active {
            color: var(--marron);
            animation: starPop 0.3s ease;
        }
        
        @keyframes starPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.25); }
            100% { transform: scale(1); }
        }
        
        .rating-stars i:hover {
            transform: scale(1.12);
            color: var(--marron-claro);
        }
        
        /* FILE UPLOAD */
        .file-upload-label {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px 26px;
            background: var(--celeste-suave);
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transicion);
            width: fit-content;
            border: 1.5px dashed var(--celeste);
            font-family: 'Quicksand', sans-serif;
            font-weight: 600;
            color: var(--marron);
            font-size: 14px;
        }
        
        .file-upload-label:hover {
            transform: translateY(-2px);
            box-shadow: var(--sombra-suave);
            border-color: var(--marron);
            background: white;
        }
        
        .file-upload input[type="file"] {
            position: absolute;
            opacity: 0;
            width: 0.1px;
            height: 0.1px;
        }
        
        .file-name {
            margin-top: 10px;
            font-size: 13px;
            color: var(--texto-medio);
            font-style: italic;
        }
        
        .image-preview {
            margin-top: 16px;
            max-width: 160px;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: var(--sombra-suave);
            display: none;
            border: 1px solid var(--celeste);
        }
        
        .image-preview.show {
            display: block;
        }
        
        .image-preview img {
            width: 100%;
            height: auto;
            display: block;
        }
        
        /* BOTÓN DE ENVÍO */
        .submit-btn {
            width: 100%;
            padding: 16px 28px;
            background: var(--marron);
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transicion);
            margin-top: 16px;
            font-family: 'Quicksand', sans-serif;
            letter-spacing: 0.5px;
        }
        
        .submit-btn:hover {
            background: var(--marron-oscuro);
            transform: translateY(-3px);
            box-shadow: 0 10px 28px rgba(74, 47, 29, 0.3);
        }
        
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        /* MENSAJES */
        .message {
            padding: 14px 18px;
            border-radius: 16px;
            margin-top: 16px;
            display: none;
            font-weight: 500;
            font-family: 'Quicksand', sans-serif;
            font-size: 14px;
        }
        
        .message.show {
            display: block;
            animation: fadeInUp 0.4s ease;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.success {
            background: var(--celeste-suave);
            color: var(--marron);
            border: 1px solid var(--celeste);
        }
        
        .message.error {
            background: #fdf2f2;
            color: #8b3a3a;
            border: 1px solid #f0c8c8;
        }
        
        /* LISTA DE OPINIONES */
        .lista-section {
            background: var(--blanco);
            border-radius: var(--borde-redondo);
            padding: 40px 36px;
            box-shadow: var(--sombra-suave);
            border: 1px solid #e8ddd0;
            transition: var(--transicion);
        }

        .lista-section:hover {
            box-shadow: var(--sombra-media);
            border-color: var(--celeste);
        }
        
        .lista-section h2 {
            font-size: 34px;
            margin-bottom: 26px;
            color: var(--marron);
            position: relative;
            display: inline-block;
        }
        
        .lista-section h2::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 45px;
            height: 2.5px;
            background: var(--marron);
            border-radius: 4px;
            transition: width 0.4s ease;
        }

        .lista-section:hover h2::after {
            width: 70px;
        }
        
        .opiniones-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-height: 750px;
            overflow-y: auto;
            padding-right: 10px;
        }
        
        .opiniones-grid::-webkit-scrollbar {
            width: 5px;
        }
        
        .opiniones-grid::-webkit-scrollbar-track {
            background: var(--celeste-suave);
            border-radius: 10px;
        }
        
        .opiniones-grid::-webkit-scrollbar-thumb {
            background: var(--marron-claro);
            border-radius: 10px;
        }
        
        .opinion-card-lista {
            background: var(--blanco-roto);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 3px 16px rgba(74, 47, 29, 0.05);
            transition: var(--transicion);
            border-left: 3px solid var(--celeste);
            position: relative;
        }
        
        .opinion-card-lista:hover {
            transform: translateY(-4px);
            box-shadow: var(--sombra-media);
            border-left-color: var(--marron);
        }
        
        .opinion-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .opinion-nombre {
            font-weight: 700;
            font-size: 16px;
            color: var(--marron);
            font-family: 'Quicksand', sans-serif;
        }
        
        .opinion-fecha {
            font-size: 12px;
            color: var(--texto-medio);
            background: var(--celeste-suave);
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 500;
        }
        
        .opinion-estrellas {
            color: var(--marron);
            margin-bottom: 10px;
            font-size: 15px;
        }
        
        .opinion-texto {
            color: var(--texto-medio);
            line-height: 1.7;
            margin-bottom: 12px;
            font-size: 14.5px;
            font-style: italic;
        }
        
        .opinion-imagen {
            max-width: 130px;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 12px;
            cursor: pointer;
            transition: var(--transicion);
            border: 1px solid #e0d6cc;
        }
        
        .opinion-imagen:hover {
            transform: scale(1.05);
            box-shadow: var(--sombra-suave);
            border-color: var(--marron);
        }
        
        .opinion-imagen img {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .no-opiniones {
            text-align: center;
            padding: 45px 20px;
            color: var(--texto-medio);
        }
        
        .no-opiniones i {
            font-size: 48px;
            color: var(--celeste);
            margin-bottom: 16px;
            animation: floatIcon 3s ease-in-out infinite;
        }
        
        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        
        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            max-width: 90%;
            max-height: 90%;
            position: relative;
            animation: zoomIn 0.35s ease;
        }
        
        @keyframes zoomIn {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        .modal-content img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border: 2px solid white;
        }
        
        .modal-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 42px;
            cursor: pointer;
            transition: var(--transicion);
            z-index: 2001;
        }
        
        .modal-close:hover {
            transform: scale(1.15) rotate(90deg);
        }
        
        /* BOTÓN FLOTANTE */
        .floating-btn {
            position: fixed;
            bottom: 28px;
            left: 28px;
            width: 58px;
            height: 58px;
            background: var(--marron);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            box-shadow: 0 8px 24px rgba(74, 47, 29, 0.3);
            cursor: pointer;
            transition: var(--transicion);
            z-index: 999;
            border: 2px solid white;
            animation: floatBounce 3s ease-in-out infinite;
        }
        
        @keyframes floatBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        
        .floating-btn:hover {
            background: var(--marron-oscuro);
            transform: scale(1.12);
            box-shadow: 0 14px 35px rgba(74, 47, 29, 0.45);
            animation: none;
        }
        
        @media (max-width: 968px) {
            .opiniones-container {
                grid-template-columns: 1fr;
            }
            .formulario-section {
                position: static;
            }
            .opiniones-hero h1 {
                font-size: 40px;
            }
        }
        
        @media (max-width: 768px) {
            .nav-menu { display: none; }
            .opiniones-container {
                padding: 30px 5%;
            }
            .formulario-section,
            .lista-section {
                padding: 28px 20px;
            }
            .opiniones-hero h1 {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <header id="header">
        <a href="index.html">
            <!-- NUEVO LOGO -->
            <img src="https://i.pinimg.com/736x/bc/14/5d/bc145d6d04b34c1d6e597726e444dd53.jpg" alt="Star Ec Logo" class="logo-img">
        </a>
        
        <nav class="nav-menu">
            <a href="index.html">Inicio</a>
            <a href="menu.html">Menú</a>
            <a href="index.html#sobre-nosotras">Sobre Nosotras</a>
            <a href="opiniones.html" class="active">Opiniones</a>
            <a href="index.html#contacto">Contacto</a>
        </nav>
    </header>
    
    <section class="opiniones-hero" data-aos="fade-down">
        <h1>✨ Opiniones ✨</h1>
        <p>Comparte tu experiencia con Star Ec</p>
    </section>
    
    <div class="opiniones-container">
        <div class="formulario-section" data-aos="fade-right">
            <h2>Deja tu opinión</h2>
            
            <form id="opinionForm">
                <div class="form-group">
                    <label for="nombre"><i class="fa-regular fa-user"></i> Tu nombre</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: María González" required>
                </div>
                
                <div class="form-group">
                    <label><i class="fa-regular fa-star"></i> Tu calificación</label>
                    <div class="rating-stars" id="ratingStars">
                        <i class="fa-regular fa-star" data-rating="1"></i>
                        <i class="fa-regular fa-star" data-rating="2"></i>
                        <i class="fa-regular fa-star" data-rating="3"></i>
                        <i class="fa-regular fa-star" data-rating="4"></i>
                        <i class="fa-regular fa-star" data-rating="5"></i>
                    </div>
                    <input type="hidden" id="rating" name="rating" value="0">
                </div>
                
                <div class="form-group">
                    <label for="comentario"><i class="fa-regular fa-message"></i> Tu opinión</label>
                    <textarea id="comentario" name="comentario" rows="4" placeholder="Cuéntanos qué te parecieron nuestros alfajores..." required></textarea>
                </div>
                
                <div class="form-group">
                    <label><i class="fa-regular fa-image"></i> Sube una foto (opcional)</label>
                    <div class="file-upload">
                        <label for="imagen" class="file-upload-label">
                            <i class="fa-regular fa-camera"></i>
                            <span>Elegir imagen</span>
                        </label>
                        <input type="file" id="imagen" name="imagen" accept="image/*">
                        <div class="file-name" id="fileName">
                            <span>Ningún archivo seleccionado</span>
                        </div>
                    </div>
                    <div class="image-preview" id="imagePreview">
                        <img src="" alt="Vista previa">
                    </div>
                </div>
                
                <button type="submit" class="submit-btn" id="submitBtn">
                    <i class="fa-regular fa-paper-plane"></i> Publicar opinión
                </button>
                
                <div class="message" id="message"></div>
            </form>
        </div>
        
        <div class="lista-section" data-aos="fade-left">
            <h2>Lo que dicen</h2>
            
            <div class="opiniones-grid" id="opinionesList">
                <div class="no-opiniones">
                    <i class="fa-regular fa-heart"></i>
                    <p>Cargando opiniones...</p>
                </div>
            </div>
        </div>
    </div>
    
    <div class="floating-btn" onclick="scrollToForm()">
        <i class="fa-regular fa-pen-to-square"></i>
    </div>
    
    <div class="modal" id="imageModal" onclick="closeModal()">
        <span class="modal-close" onclick="event.stopPropagation(); closeModal()">&times;</span>
        <div class="modal-content" onclick="event.stopPropagation()">
            <img src="" alt="Imagen grande" id="modalImage">
        </div>
    </div>
    
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        const SUPABASE_URL = 'https://xhbwlgqlvqqxagpdnsqk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhoYndsZ3FsdnFxeGFncGRuc3FrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE5Nzg5NTEsImV4cCI6MjA4NzU1NDk1MX0.9K6JPZ205aM9u0zCDDriw1y6MQy2bhhOCdTECFNa1Ig';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let currentRating = 0;
        let selectedFile = null;
        
        AOS.init({ duration: 800, once: true, offset: 40, easing: 'ease-in-out' });
        
        window.addEventListener('scroll', () => {
            document.getElementById('header').classList.toggle('scrolled', window.scrollY > 30);
        });
        
        const stars = document.querySelectorAll('.rating-stars i');
        const ratingInput = document.getElementById('rating');
        
        stars.forEach(star => {
            star.addEventListener('mouseenter', function() {
                highlightStars(parseInt(this.getAttribute('data-rating')));
            });
            star.addEventListener('mouseleave', function() {
                highlightStars(currentRating);
            });
            star.addEventListener('click', function() {
                currentRating = parseInt(this.getAttribute('data-rating'));
                ratingInput.value = currentRating;
                highlightStars(currentRating);
            });
        });
        
        function highlightStars(rating) {
            stars.forEach(star => {
                const starRating = parseInt(star.getAttribute('data-rating'));
                if (starRating <= rating) {
                    star.classList.remove('fa-regular');
                    star.classList.add('fa-solid', 'active');
                } else {
                    star.classList.remove('fa-solid', 'active');
                    star.classList.add('fa-regular');
                }
            });
        }
        
        const fileInput = document.getElementById('imagen');
        const fileName = document.getElementById('fileName').querySelector('span');
        const imagePreview = document.getElementById('imagePreview');
        const previewImg = imagePreview.querySelector('img');
        
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                selectedFile = file;
                fileName.textContent = file.name;
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImg.src = e.target.result;
                    imagePreview.classList.add('show');
                }
                reader.readAsDataURL(file);
            } else {
                selectedFile = null;
                fileName.textContent = 'Ningún archivo seleccionado';
                imagePreview.classList.remove('show');
            }
        });
        
        const form = document.getElementById('opinionForm');
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');
        
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (currentRating === 0) {
                showMessage('Por favor selecciona una calificación', 'error');
                return;
            }
            
            const nombre = document.getElementById('nombre').value.trim();
            const comentario = document.getElementById('comentario').value.trim();
            
            if (!nombre || !comentario) {
                showMessage('Por favor completa todos los campos requeridos', 'error');
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-regular fa-spinner fa-spin"></i> Publicando...';
            
            try {
                let imagenUrl = null;
                
                if (selectedFile) {
                    const fileName = `opiniones/${Date.now()}-${selectedFile.name}`;
                    const { error: uploadError } = await client.storage
                        .from('opiniones-imagenes')
                        .upload(fileName, selectedFile, { cacheControl: '3600', upsert: false });
                    
                    if (uploadError) throw uploadError;
                    
                    const { data: { publicUrl } } = client.storage
                        .from('opiniones-imagenes')
                        .getPublicUrl(fileName);
                    
                    imagenUrl = publicUrl;
                }
                
                const { error } = await client
                    .from('opiniones')
                    .insert([{
                        nombre: nombre,
                        rating: currentRating,
                        comentario: comentario,
                        imagen_url: imagenUrl,
                        fecha: new Date().toISOString()
                    }]);
                
                if (error) throw error;
                
                showMessage('¡Gracias por tu opinión!', 'success');
                form.reset();
                currentRating = 0;
                highlightStars(0);
                selectedFile = null;
                fileName.textContent = 'Ningún archivo seleccionado';
                imagePreview.classList.remove('show');
                
                cargarOpiniones();
                
            } catch (error) {
                console.error('Error:', error);
                showMessage('Hubo un error al publicar tu opinión. Intenta de nuevo.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-regular fa-paper-plane"></i> Publicar opinión';
            }
        });
        
        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type} show`;
            setTimeout(() => { messageDiv.classList.remove('show'); }, 5000);
        }
        
        async function cargarOpiniones() {
            const opinionesList = document.getElementById('opinionesList');
            try {
                const { data: opiniones, error } = await client
                    .from('opiniones')
                    .select('*')
                    .order('fecha', { ascending: false });
                
                if (error) throw error;
                
                if (opiniones.length === 0) {
                    opinionesList.innerHTML = `
                        <div class="no-opiniones">
                            <i class="fa-regular fa-heart"></i>
                            <p>No hay opiniones todavía. ¡Sé la primera!</p>
                        </div>`;
                    return;
                }
                
                opinionesList.innerHTML = opiniones.map(op => `
                    <div class="opinion-card-lista" data-aos="fade-up">
                        <div class="opinion-header">
                            <span class="opinion-nombre">${op.nombre}</span>
                            <span class="opinion-fecha">${new Date(op.fecha).toLocaleDateString()}</span>
                        </div>
                        <div class="opinion-estrellas">
                            ${Array(op.rating).fill('<i class="fa-solid fa-star"></i>').join('')}
                            ${Array(5 - op.rating).fill('<i class="fa-regular fa-star"></i>').join('')}
                        </div>
                        <p class="opinion-texto">${op.comentario}</p>
                        ${op.imagen_url ? `
                            <div class="opinion-imagen" onclick="abrirModal('${op.imagen_url}')">
                                <img src="${op.imagen_url}" alt="Foto de opinión">
                            </div>` : ''}
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error cargando opiniones:', error);
                opinionesList.innerHTML = `
                    <div class="no-opiniones">
                        <i class="fa-regular fa-circle-exclamation"></i>
                        <p>Error al cargar. Intenta de nuevo.</p>
                    </div>`;
            }
        }
        
        function abrirModal(imageUrl) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            modalImg.src = imageUrl;
            modal.classList.add('show');
            document.body.style.overflow = 'hidden';
        }
        
        function closeModal() {
            const modal = document.getElementById('imageModal');
            modal.classList.remove('show');
            document.body.style.overflow = '';
        }
        
        function scrollToForm() {
            document.querySelector('.formulario-section').scrollIntoView({ behavior: 'smooth' });
        }
        
        cargarOpiniones();
        
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });
        
        window.abrirModal = abrirModal;
        window.closeModal = closeModal;
        window.scrollToForm = scrollToForm;
    </script>
</body>
</html>
